# Primary domain for O Fornecedor: https://ofornecedor.tech/
# Redirects www.ofornecedor.tech, ofornecedor.srv2058756.hstgr.cloud and legacy buscabusca host -> https://ofornecedor.tech/
server {
    listen 80;
    listen [::]:80;
    server_name ofornecedor.tech www.ofornecedor.tech ofornecedor.srv2058756.hstgr.cloud buscabusca.srv2058756.hstgr.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/buscabusca-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://ofornecedor.tech$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ofornecedor.tech;

    ssl_certificate /etc/letsencrypt/live/ofornecedor.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ofornecedor.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://ofornecedor.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name buscabusca.srv2058756.hstgr.cloud;

    ssl_certificate /etc/letsencrypt/live/buscabusca.srv2058756.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buscabusca.srv2058756.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://ofornecedor.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ofornecedor.srv2058756.hstgr.cloud;

    ssl_certificate /etc/letsencrypt/live/ofornecedor.srv2058756.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ofornecedor.srv2058756.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://ofornecedor.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ofornecedor.tech;

    ssl_certificate /etc/letsencrypt/live/ofornecedor.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ofornecedor.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /api/internal/ {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
