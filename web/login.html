<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9fc">
  <title>Entrar · O Fornecedor</title>
  <style>
    :root { --bg:#f7f9fc; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#0f172a; --danger:#dc2626; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:20px; }
    .login-card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 28px; box-shadow:0 12px 32px rgba(15,23,42,.06); }
    .brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:22px; }
    .brand svg { width:26px; height:30px; fill:var(--text); }
    .brand span { font-size:20px; font-weight:700; letter-spacing:-.02em; }
    h1 { margin:0 0 6px; font-size:18px; text-align:center; font-weight:600; }
    p.sub { margin:0 0 22px; font-size:13px; color:var(--muted); text-align:center; }
    label { display:block; font-size:12px; font-weight:600; color:#334155; margin-bottom:6px; }
    input { width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; font-size:15px; outline:none; margin-bottom:14px; background:#fff; color:var(--text); }
    input:focus { border-color:#0f172a; box-shadow:0 0 0 3px rgba(15,23,42,.08); }
    button { width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; margin-top:4px; }
    button:hover { opacity:.92; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .error { display:none; background:#fef2f2; color:var(--danger); border:1px solid #fecaca; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; text-align:center; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <svg viewBox="0 0 24 28" aria-hidden="true"><path d="M16.7 4.4c1-1.2 1.6-2.6 1.5-4.1-1.5.1-3.3 1-4.3 2.2-.9 1-1.7 2.6-1.5 4 1.7.1 3.3-.8 4.3-2.1ZM20.9 14.5c0-3.3 2.7-4.8 2.8-4.9-1.6-2.3-4-2.6-4.9-2.7-2.1-.2-4.1 1.2-5.2 1.2-1 0-2.7-1.2-4.5-1.2C6.8 7 4.5 8.4 3.3 10.4.8 14.8 2.6 21.4 5 24.9c1.2 1.7 2.5 3.5 4.3 3.4 1.7-.1 2.4-1.1 4.5-1.1 2 0 2.7 1.1 4.5 1 1.9 0 3.1-1.7 4.2-3.4 1.4-1.9 2-3.8 2-3.9-.1 0-3.6-1.4-3.6-5.4Z" transform="translate(-1 -1) scale(.9)"/></svg>
      <span>O Fornecedor</span>
    </div>
    <h1>Acesso ao O Fornecedor</h1>
    <p class="sub">Entre com seu usuário e senha para ver as cotações ao vivo.</p>
    <div class="error" id="errBox" role="alert"></div>
    <form id="loginForm" autocomplete="on">
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="Digite seu usuário">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Digite sua senha">
      <button type="submit" id="btnLogin">Entrar</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('errBox');
    const btn = document.getElementById('btnLogin');
    const params = new URLSearchParams(window.location.search);
    const nextUrl = params.get('next') || '';

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            next: nextUrl
          })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          errBox.textContent = data.error || 'Não foi possível entrar.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return;
        }
        window.location.href = data.redirect || '/';
      } catch (e) {
        errBox.textContent = 'Falha de conexão. Tente novamente.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
